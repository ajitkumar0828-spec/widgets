# Manual Contact Center scans only; setup commits use [skip ci].
name: Contact Center SonarCloud
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-center-sonar-next
  cancel-in-progress: false

jobs:
  sonarqube:
    name: Contact Center analysis and report
    if: github.repository == 'ajitkumar0828-spec/widgets' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=4096
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify credential is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Add SONAR_TOKEN in this fork's GitHub Actions secrets."
            exit 1
          fi

      - name: Validate scope and report contracts
        run: |
          python3 scripts/sonar/test_report.py
          python3 scripts/sonar/report.py scope

      - name: Install locked dependencies
        run: node .yarn/releases/yarn-4.5.1.cjs install --immutable

      - name: Build required workspaces
        id: build
        continue-on-error: true
        run: |
          node scripts/sonar/build.cjs

      - name: Unit tests including untested source files
        id: coverage
        continue-on-error: true
        run: node scripts/sonar/coverage.cjs

      - name: Validate and normalize LCOV source paths
        id: lcov
        run: python3 scripts/sonar/report.py normalize

      - name: SonarQube Cloud scan
        id: scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.branch.name=next
            -Dsonar.scm.revision=${{ github.sha }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for server processing and export verified report
        id: report
        if: always() && steps.scan.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/sonar/report.py export

      - name: Record an incomplete scan explicitly
        if: always() && steps.scan.outcome != 'success'
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.coverage.outcome }}
          LCOV_OUTCOME: ${{ steps.lcov.outcome }}
        run: |
          mkdir -p reports/sonar/latest
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = {k: os.environ.get(k) for k in
                    ('GITHUB_SHA', 'GITHUB_RUN_URL', 'SCAN_OUTCOME', 'BUILD_OUTCOME', 'TEST_OUTCOME', 'LCOV_OUTCOME')}
          Path('reports/sonar/latest/failure.json').write_text(json.dumps(result, indent=2))
          Path('reports/sonar/latest/SUMMARY.md').write_text(
              '# Sonar scan incomplete\n\nThis run did not produce a verified analysis.\n\n'
              + '\n'.join(f'- {k}: {v}' for k, v in result.items()) + '\n')
          PYCODE

      - name: Publish report to workflow summary
        if: always()
        run: |
          if [ -f reports/sonar/latest/SUMMARY.md ]; then
            cat reports/sonar/latest/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-center-sonar-${{ github.sha }}
          path: |
            reports/sonar/
            coverage/sonar/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the unit-test failure status
        if: always() && (steps.coverage.outcome != 'success' || steps.build.outcome != 'success')
        run: |
          echo "::error::Unit tests or their prerequisites did not pass; see reports/sonar and the logs."
          exit 1
